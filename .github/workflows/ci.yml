name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx turbo run typecheck build
      - run: npm test
      - run: npm run check:plugin
      - name: Stdio smoke test (launcher, MCP handshake, mock vendor)
        run: npm run smoke
      - name: Offline eval smoke test
        run: npm run eval -- --candidates mock --markdown none --out /tmp/mock-eval.json
