# Render Blueprint: the Express API plus a Postgres database for the shared
# budget ledger and usage records. Deploy with "New > Blueprint" on render.com.
services:
  - type: web
    name: modelgate-api
    runtime: node
    buildCommand: npm ci --include=dev && npx turbo run build --filter=@modelgate/api...
    startCommand: node apps/api/dist/index.js
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: modelgate-db
          property: connectionString
      - key: MODELGATE_API_TOKEN
        generateValue: true
      - key: MODELGATE_BUDGET_USD
        value: "20"
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: MODELGATE_VENDORS
        sync: false
      - key: MODELGATE_ALERT_WEBHOOK
        sync: false

databases:
  - name: modelgate-db
    databaseName: modelgate
